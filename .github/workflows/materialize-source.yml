name: Materialize CASE-002 source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/source.html.gz.b64"
      - ".github/workflows/materialize-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode report source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          base64 -d .bootstrap/source.html.gz.b64 | gunzip > report/source.html
          test -s report/source.html
          grep -q "XZ Utils Backdoor - Technical Case Study" report/source.html

      - name: Remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/materialize-source.yml

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "M. D. V."
          git config user.email "232046078+Michel-DV@users.noreply.github.com"
          git add -A
          git commit -m "report: materialize CASE-002 publication source"
          git push origin HEAD:main

name: Publish XZ Utils case study

on:
  push:
    branches: [main]
    paths:
      - "report/source.html"
      - "report/cover.html"
      - "RELEASE_NOTES.md"
      - ".github/workflows/publish-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xz-case-study-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.0
  PDF_PATH: report/XZ_Utils_Backdoor_Case_Study_Michel-DV.pdf
  BODY_PDF: report/.body.generated.pdf
  COVER_PDF: report/.cover.generated.pdf

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "bin=$(command -v "$candidate")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Chrome/Chromium not found on runner" >&2
          exit 1

      - name: Render body and cover
        shell: bash
        run: |
          set -euo pipefail
          CHROME="${{ steps.chrome.outputs.bin }}"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --no-pdf-header-footer --print-to-pdf="$GITHUB_WORKSPACE/$BODY_PDF" "file://$GITHUB_WORKSPACE/report/source.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --no-pdf-header-footer --print-to-pdf="$GITHUB_WORKSPACE/$COVER_PDF" "file://$GITHUB_WORKSPACE/report/cover.html"
          test -s "$BODY_PDF"
          test -s "$COVER_PDF"

      - name: Assemble publication
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader, PdfWriter
          from pathlib import Path
          body = PdfReader("report/.body.generated.pdf")
          cover = PdfReader("report/.cover.generated.pdf")
          if not body.pages or not cover.pages:
              raise SystemExit("PDF rendering failed")
          writer = PdfWriter()
          writer.add_page(cover.pages[0])
          for page in body.pages:
              writer.add_page(page)
          with Path("report/XZ_Utils_Backdoor_Case_Study_Michel-DV.pdf").open("wb") as f:
              writer.write(f)
          PY
          rm -f "$BODY_PDF" "$COVER_PDF"
          test -s "$PDF_PATH"

      - name: Write integrity checksum
        shell: bash
        run: |
          set -euo pipefail
          cd report
          sha256sum "$(basename "$PDF_PATH")" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Commit generated publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "M. D. V."
          git config user.email "232046078+Michel-DV@users.noreply.github.com"
          git add "$PDF_PATH" report/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "release: publish CASE-002 XZ Utils v1.0.0"
            git push origin HEAD:main
          fi

      - name: Create or refresh v1.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          TARGET_SHA=$(git rev-parse origin/main)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PDF_PATH#XZ Utils Backdoor Case Study PDF" --clobber
          else
            gh release create "$RELEASE_TAG" "$PDF_PATH#XZ Utils Backdoor Case Study PDF" --target "$TARGET_SHA" --title "XZ Utils Backdoor Case Study - v1.0.0" --notes-file RELEASE_NOTES.md
          fi

      - name: Publication summary
        shell: bash
        run: |
          {
            echo "## CASE-002 — XZ Utils Backdoor"
            echo
            echo "- PDF: \`$PDF_PATH\`"
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 report/SHA256SUMS.txt)\`"
            echo "- Author: \`@Michel-DV\`"
            echo "- Status: final analytical edition"
          } >> "$GITHUB_STEP_SUMMARY"
